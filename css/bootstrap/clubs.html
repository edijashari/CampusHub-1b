
<!DOCTYPE html>
<html lang="sq">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clubs - CampusHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<body>

    <header class="bg-dark text-white p-3">
        <div class="container">
            <h1>CampusHub</h1>

            <nav>
                <a href="index.html" class="text-white me-3">Home</a>
                <a href="events.html" class="text-white me-3">Events</a>
                <a href="clubs.html" class="text-white me-3">Clubs</a>
                <a href="contact.html" class="text-white">Contact</a>
            </nav>
        </div>
    </header>

    <main class="container my-4">

        <h2 class="text-center">University Clubs</h2>

        <p class="text-center mb-4">
            Meet students and learn new skills.
        </p>

        <div class="row">

            <div class="col-md-4">
                <div class="card p-3">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRDfD5kO7dzRiJAk-wsGVdwnIe1hL57wqEm4Z0g2QprxQ&s=10"

                    <h3>Programming Club</h3>
                    <p>Learn programming and web development.</p>
                    <button class="btn btn-primary">Join Club</button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSuFVbW_2oEIBEgFA3olgYNuSVuvj8gfrpyUIgDa-yJxg&s=10"

                         alt="Robotics Club">

                    <p>Learn robotics and electronics.</p>
                    <button class="btn btn-success">Join Club</button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQaikreSrt7oIhFcuGRl97DvWwB1McFZW6tLUo4Nl5VyQ&s=10"
                         class="img-fluid rounded"
                         alt="Design Club">

                    <h3>Design Club</h3>
                    <p>Learn design and creativity.</p>
                    <button class="btn btn-outline-primary">Join Club</button>
                </div>
            </div>

        </div>

    <footer class="bg-dark text-white text-center p-3">
        <p>© 2026 CampusHub. All rights reserved.</p>
    </footer>
